<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Lista de compras do mercado da Mari e do Carlos">
  <title>Minhas Compras</title>

  <link rel="manifest" href="manifest.json">

  <!-- favicons: o de 64 vem primeiro para o navegador preferir o mais nítido. -->
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Compras">

  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="app">
    <!-- Cabeçalho e, na Lista, o seletor e a busca: ficam presos no topo enquanto
         a lista rola por baixo, como no design. Cada tela preenche os dois. -->
    <div class="topo-fixo">
      <header id="cabecalho" class="cabecalho oculto"></header>
      <div id="topo-tela"></div>
    </div>

    <main id="tela" class="cheia" tabindex="-1">
      <div class="girando" aria-label="Carregando"></div>
    </main>

    <nav id="abas" class="abas oculto" aria-label="Navegação principal">
      <a href="#/lista" class="abas__item" data-rota="lista">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>
        <span>Lista</span>
      </a>
      <a href="#/orcamento" class="abas__item" data-rota="orcamento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/></svg>
        <span>Orçamento</span>
      </a>
      <a href="#/historico" class="abas__item" data-rota="historico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Histórico</span>
      </a>
      <a href="#/ajustes" class="abas__item" data-rota="ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
